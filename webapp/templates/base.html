<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SNM Project{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --surface:      #fcfcfb;
      --plane:        #f9f9f7;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:   #898781;
      --border:       rgba(11,11,11,0.10);
      --gridline:     #e1e0d9;
      --accent:       #2a78d6;
      --accent-soft:  #cde2fb;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --surface:      #1a1a19;
        --plane:        #0d0d0d;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted:   #898781;
        --border:       rgba(255,255,255,0.10);
        --gridline:     #2c2c2a;
        --accent:       #3987e5;
        --accent-soft:  #184f95;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --surface:      #1a1a19;
      --plane:        #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:   #898781;
      --border:       rgba(255,255,255,0.10);
      --gridline:     #2c2c2a;
      --accent:       #3987e5;
      --accent-soft:  #184f95;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--plane);
      color: var(--text-primary);
      line-height: 1.5;
    }
    h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; }
    h1 { font-size: 1.5rem; margin: 0 0 1.25rem; }
    h2 { font-size: 1.05rem; color: var(--text-secondary); margin: 2rem 0 0.75rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 3.25rem;
    }
    .topbar .brand { font-weight: 600; font-size: 0.95rem; }
    .topbar nav { display: flex; gap: 1.5rem; }
    .topbar nav a {
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
    }
    .topbar nav a:hover, .topbar nav a.active {
      color: var(--text-primary);
      text-decoration: none;
      border-bottom-color: var(--accent);
    }

    main {
      max-width: 62rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* Stat tiles */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    .stat-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }
    .stat-tile .label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }
    .stat-tile .value {
      font-size: 1.6rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .stat-tile .sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }
    .meter-track {
      height: 6px;
      background: var(--gridline);
      border-radius: 3px;
      margin-top: 0.6rem;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }
    .meter-fill.indeterminate {
      width: 40%;
      animation: meter-indeterminate 1.2s ease-in-out infinite;
    }
    @keyframes meter-indeterminate {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--gridline);
    }
    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      background: var(--plane);
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--plane); }
    td.num { font-variant-numeric: tabular-nums; }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 1.5rem;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    form.filters {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
    }
    form.filters label {
      display: flex;
      flex-direction: column;
      font-size: 0.78rem;
      color: var(--text-secondary);
      gap: 0.25rem;
    }
    form.filters details {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    form.filters details summary {
      cursor: pointer;
      user-select: none;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--plane);
    }
    form.filters details[open] summary {
      border-radius: 6px 6px 0 0;
    }
    form.filters input {
      font: inherit;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--plane);
      color: var(--text-primary);
    }
    form.filters button {
      font: inherit;
      padding: 0.4rem 0.9rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .pagination { margin-top: 1rem; font-size: 0.88rem; display: flex; gap: 1rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">SNM Project</span>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/posts">Post</a>
      <a href="/accounts">Account / Bot</a>
      <a href="/ai-detection">AI Detection</a>
      <a href="/fact-check">Fact-Check</a>
      <a href="/pipelines">Pipeline</a>
      <a href="/db-sync">Import/Export</a>
    </nav>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
